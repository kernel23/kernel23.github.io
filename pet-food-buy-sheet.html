<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet food buy sheet</title>
<style>
  :root{
    --paper:#f6f2e9; --card:#fffdf8; --ink:#2b2a26; --ink2:#6b6860;
    --line:#e4ddcd; --amber:#b9781a; --amber-bg:#f7ead1;
    --dog:#a8531f; --dog-bg:#f6e6da; --cat:#0f6e56; --cat-bg:#dcf0e8;
    --great:#2f6d12; --great-bg:#e7f2d7; --ok:#8a5a0a; --ok-bg:#f8ead0;
    --thin:#9e2a24; --thin-bg:#f7dcd9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 130px}
  h1{font-size:22px;font-weight:600;margin:0 0 2px}
  .sub{color:var(--ink2);font-size:13px;margin:0 0 16px}
  .tnum{font-variant-numeric:tabular-nums}

  .controls{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 12px 4px;margin-bottom:12px}
  .ctrl-row{display:flex;gap:10px;flex-wrap:wrap}
  .field{flex:1 1 90px;margin-bottom:10px}
  .field label{display:block;font-size:11px;color:var(--ink2);margin-bottom:3px;
    text-transform:none;letter-spacing:0}
  .field .peso{position:relative}
  .field .peso span{position:absolute;left:9px;top:50%;transform:translateY(-50%);
    color:var(--ink2);font-size:14px}
  .field input{width:100%;padding:8px 8px 8px 22px;border:1px solid var(--line);
    border-radius:9px;font-size:15px;background:#fff;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .field input:focus{outline:none;border-color:var(--amber)}

  .savebox{padding:12px}
  .sl-title{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--ink2)}
  .sl-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .sl-btns button,.filebtn{padding:8px 14px;border:1px solid var(--line);border-radius:9px;
    background:#fff;color:var(--ink);font-size:14px;cursor:pointer;font-weight:600}
  #saveBtn{background:var(--ink);color:#fff;border-color:var(--ink)}
  #loadBtn{background:var(--amber);color:#fff;border-color:var(--amber)}
  .filebtn{display:inline-flex;align-items:center}
  #slText{width:100%;min-height:52px;border:1px solid var(--line);border-radius:9px;
    padding:8px;font-size:12px;font-family:monospace;background:#fff;color:var(--ink);resize:vertical}
  #slText:focus{outline:none;border-color:var(--amber)}
  .sl-msg{font-size:12px;color:var(--cat);margin-top:6px;min-height:16px}
  .sl-msg.err{color:var(--thin)}
  .bar{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
  .chips{display:flex;gap:6px}
  .chip{padding:6px 13px;border:1px solid var(--line);border-radius:20px;
    background:var(--card);font-size:13px;cursor:pointer;color:var(--ink2)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sortsel{margin-left:auto;font-size:13px;padding:6px 8px;border:1px solid var(--line);
    border-radius:9px;background:var(--card);color:var(--ink)}

  .top{background:var(--amber-bg);border:1px solid #ecd6a8;border-radius:12px;
    padding:10px 13px;margin-bottom:14px;font-size:13px;color:#6a4a12}
  .top b{color:#4d340a}

  .count{font-size:12px;color:var(--ink2);margin:0 0 8px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;margin-bottom:9px}
  .card.best{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
  .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .cname{font-weight:600;font-size:15px;line-height:1.25}
  .tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;
    white-space:nowrap;margin-top:2px;display:inline-block}
  .tag.dog{background:var(--dog-bg);color:var(--dog)}
  .tag.cat{background:var(--cat-bg);color:var(--cat)}
  .dtag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;margin-top:2px;
    margin-left:5px;display:inline-block;white-space:nowrap}
  .d1{background:#1f4e79;color:#fff}
  .d2{background:#e2ecf7;color:#26517d}
  .d3{background:#eeece5;color:#7a776d}
  .profit{text-align:right;white-space:nowrap}
  .profit .big{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .mbadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:7px;
    display:inline-block;margin-top:2px}
  .m-great{background:var(--great-bg);color:var(--great)}
  .m-ok{background:var(--ok-bg);color:var(--ok)}
  .m-thin{background:var(--thin-bg);color:var(--thin)}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;
    padding-top:9px;border-top:1px solid var(--line)}
  .cell label{display:block;font-size:10px;color:var(--ink2);margin-bottom:2px}
  .cell .ed{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:7px;
    font-size:14px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
  .cell .ed:focus{outline:none;border-color:var(--amber)}
  .cell .ro{font-size:14px;padding:5px 0;font-variant-numeric:tabular-nums;color:var(--ink)}
  .flag{color:var(--thin);cursor:help}
  .anbox{padding:12px}
  .an-empty{font-size:13px;color:var(--ink2);padding:6px 0}
  .an-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--amber);margin:8px 0 4px}
  .an-item{padding:7px 0;border-bottom:1px solid var(--line)}
  .an-name{font-size:14px;font-weight:600}
  .an-name span{color:var(--ink2);font-weight:400;font-size:12px}
  .an-nums{font-size:12px;color:var(--ink2);margin-top:2px}
  .an-line{font-size:12px;color:var(--great);font-weight:600;margin-top:1px}
  .an-tot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;
    padding-top:10px;border-top:2px solid var(--line)}
  .an-tot div{display:flex;flex-direction:column}
  .an-tot span{font-size:10px;color:var(--ink2)}
  .an-tot b{font-size:15px;font-variant-numeric:tabular-nums}
  .an-tot b.over{color:var(--thin)}
  .an-share{display:flex;gap:8px;margin-top:12px}
  .an-share button{padding:8px 16px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
  #shareBtn{background:var(--cat);color:#fff;border:1px solid var(--cat)}
  #copyAnBtn{background:#fff;color:var(--ink);border:1px solid var(--line)}
  #anText{width:100%;min-height:130px;margin-top:8px;border:1px solid var(--line);
    border-radius:9px;padding:8px;font-size:12px;font-family:monospace;background:#fff;color:var(--ink)}
  .foot{font-size:12px;color:var(--ink2);margin-top:18px;line-height:1.6}

  .orderrow{display:flex;align-items:center;justify-content:space-between;
    margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);
    border-radius:9px;overflow:hidden}
  .stepper button{width:36px;height:32px;border:none;background:#fff;color:var(--ink);
    font-size:19px;line-height:1;cursor:pointer}
  .stepper button:active{background:var(--amber-bg)}
  .stepper span{min-width:32px;text-align:center;font-size:15px;height:32px;line-height:32px;
    font-variant-numeric:tabular-nums;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .linecost{font-size:13px;color:var(--amber);font-weight:600}
  .orderbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.07);z-index:20}
  .orderbar .inner{max-width:560px;margin:0 auto;padding:9px 14px}
  .ob-main{display:flex;gap:8px}
  .ob-stat{flex:1;text-align:center}
  .ob-stat span{display:block;font-size:10px;color:var(--ink2)}
  .ob-stat b{font-size:16px;font-variant-numeric:tabular-nums}
  .ob-stat b.over{color:var(--thin)}
  .ob-sub{display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:5px;font-size:12px;color:var(--ink2)}
  .ob-sub input{width:78px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;
    font-size:13px;text-align:right;font-variant-numeric:tabular-nums;background:#fff;color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pet food buy sheet</h1>
  <p class="sub">Set your selling price per kilo. Every sack ranks by profit — highest first.</p>

  <div class="controls">
    <div class="ctrl-row">
      <div class="field">
        <label for="dogSell">Dog sell / kg</label>
        <div class="peso"><span>₱</span><input id="dogSell" type="number" inputmode="decimal" value="100"></div>
      </div>
      <div class="field">
        <label for="catSell">Cat sell / kg</label>
        <div class="peso"><span>₱</span><input id="catSell" type="number" inputmode="decimal" value="120"></div>
      </div>
      <div class="field">
        <label for="pack">Packaging / sack</label>
        <div class="peso"><span>₱</span><input id="pack" type="number" inputmode="decimal" value="80"></div>
      </div>
    </div>
  </div>

  <div class="controls savebox">
    <div class="sl-title">Save / load your work</div>
    <div class="sl-btns">
      <button id="saveBtn" type="button">Save</button>
      <button id="loadBtn" type="button">Load</button>
      <button id="dlBtn" type="button">Download file</button>
      <label class="filebtn">Open file<input type="file" id="fileIn" accept=".json,application/json" style="display:none"></label>
    </div>
    <textarea id="slText" placeholder="Tap Save to create your code here, then copy it somewhere safe. To restore later, paste a code into this box and tap Load."></textarea>
    <div class="sl-msg" id="slMsg"></div>
  </div>

  <div class="bar">
    <div class="chips">
      <div class="chip on" data-f="all">All</div>
      <div class="chip" data-f="dog">Dog</div>
      <div class="chip" data-f="cat">Cat</div>
    </div>
    <select class="sortsel" id="sort">
      <option value="profit">Sort: profit / sack</option>
      <option value="margin">Sort: margin %</option>
      <option value="demand">Sort: demand</option>
      <option value="cpk">Sort: cheapest / kg</option>
      <option value="name">Sort: name</option>
    </select>
  </div>

  <div class="top" id="topPick"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>

  <div class="controls anbox">
    <div class="sl-title">Order analysis</div>
    <div id="analysis"></div>
    <div class="an-share" id="shareRow" style="display:none">
      <button id="shareBtn" type="button">Share</button>
      <button id="copyAnBtn" type="button">Copy text</button>
    </div>
    <div class="sl-msg" id="anMsg"></div>
    <textarea id="anText" style="display:none" readonly></textarea>
  </div>

  <p class="foot" id="foot"></p>
</div>

<div class="orderbar">
  <div class="inner">
    <div class="ob-main">
      <div class="ob-stat"><span>Order cost</span><b id="obCost">₱0</b></div>
      <div class="ob-stat"><span>Remaining</span><b id="obRem">₱15,000</b></div>
      <div class="ob-stat"><span>Est. profit / cycle</span><b id="obProfit">₱0</b></div>
    </div>
    <div class="ob-sub"><span id="obSacks">0 sacks</span> · budget ₱<input id="budget" type="number" inputmode="numeric" value="15000"></div>
  </div>
</div>

<script>
  var DATA = [
    // Dog
    {c:"dog",n:"Top Breed Adult",kg:20,p:1320},
    {c:"dog",n:"Top Breed Puppy",kg:20,p:1620},
    {c:"dog",n:"Aozi Gold Adult",kg:20,p:2980},
    {c:"dog",n:"Aozi Silver Puppy",kg:20,p:3070},
    {c:"dog",n:"Beef Pro Adult",kg:22.7,p:2570},
    {c:"dog",n:"Beef Pro Puppy",kg:22.7,p:3100},
    {c:"dog",n:"Bingo Adult",kg:20,p:1280},
    {c:"dog",n:"Good Boy Adult (green)",kg:20,p:1330},
    {c:"dog",n:"Good Boy Orange Adult",kg:20,p:1260},
    {c:"dog",n:"Holistic Adult",kg:15,p:2480},
    {c:"dog",n:"Holistic Puppy",kg:15,p:2480},
    {c:"dog",n:"Nutri Chunks Adult Beef",kg:20,p:2040},
    {c:"dog",n:"Nutri Chunks Puppy",kg:20,p:2750},
    {c:"dog",n:"Pedigree Adult",kg:20,p:2500},
    {c:"dog",n:"Pedigree Adult Mini",kg:20,p:2500},
    {c:"dog",n:"Pedigree Puppy",kg:15,p:2300},
    {c:"dog",n:"Powerdog Adult",kg:16,p:2010},
    {c:"dog",n:"Powerdog Puppy",kg:16,p:2090},
    {c:"dog",n:"Special Dog Adult",kg:9,p:1120},
    {c:"dog",n:"Special Dog Puppy",kg:9,p:1140},
    {c:"dog",n:"Vitality Adult",kg:15,p:2570},
    {c:"dog",n:"Vitality Puppy",kg:15,p:2730},
    {c:"dog",n:"Value Meal Adult",kg:20,p:2470},
    {c:"dog",n:"Zoi Dog",kg:20,p:1160},
    {c:"dog",n:"Whoopy Adult",kg:20,p:1340},
    {c:"dog",n:"Whoopy Puppy",kg:20,p:1540},
    {c:"dog",n:"Dogibeef",kg:22.7,p:1450},
    {c:"dog",n:"Beef Teriyaki",kg:8,p:470},
    {c:"dog",n:"Doggyjoy",kg:20,p:1236,guess:true},
    // Cat
    {c:"cat",n:"Aozi Cat",kg:20,p:3100},
    {c:"cat",n:"Aozi Kitten Yellow",kg:10,p:1725},
    {c:"cat",n:"Aozi Kitten Violet",kg:10,p:1800},
    {c:"cat",n:"Catcare",kg:7,p:1450},
    {c:"cat",n:"Cuties Cat",kg:22,p:2400},
    {c:"cat",n:"Infinity Cat Salmon",kg:20,p:1780},
    {c:"cat",n:"Infinity Cat Ocean",kg:20,p:2120},
    {c:"cat",n:"Lucy",kg:20,p:2050},
    {c:"cat",n:"Lucy 26",kg:20,p:1780},
    {c:"cat",n:"Nutricare",kg:22,p:1770},
    {c:"cat",n:"Powercat Adult",kg:8,p:1450},
    {c:"cat",n:"Powercat Kitten",kg:7,p:1450},
    {c:"cat",n:"Princess",kg:22.7,p:2750},
    {c:"cat",n:"Special Cat",kg:7,p:935},
    {c:"cat",n:"Special Cat Urinary",kg:7,p:1240},
    {c:"cat",n:"Whiskas Adult (tuna/ocean/mackerel)",kg:7,p:1060},
    {c:"cat",n:"Whiskas Adult",kg:15,p:3030},
    {c:"cat",n:"Whiskas Kitten",kg:6.5,p:1100},
    {c:"cat",n:"Zoi Cat Chicken",kg:20,p:2000},
    {c:"cat",n:"Zoi Cat Tuna",kg:20,p:2080,guess:true},
    {c:"cat",n:"Smartheart Cat",kg:15,p:2130},
    {c:"cat",n:"Smartheart Cat Adult",kg:7,p:1050},
    {c:"cat",n:"Smart Kitten",kg:7,p:1220},
    {c:"cat",n:"Cahaya Hati",kg:10,p:1280},
    {c:"cat",n:"Top Cat",kg:20,p:2040},
    {c:"cat",n:"Monelo Cat",kg:7,p:1050},
    {c:"cat",n:"Toei Cat Tuna & Salmon",kg:20,p:1710}
  ];
  var T1=["Pedigree Adult","Pedigree Adult Mini","Pedigree Puppy","Nutri Chunks Adult Beef","Nutri Chunks Puppy","Whiskas Adult (tuna/ocean/mackerel)","Whiskas Adult","Whiskas Kitten","Smartheart Cat","Smartheart Cat Adult","Smart Kitten"];
  var T2=["Top Breed Adult","Top Breed Puppy","Special Dog Adult","Special Dog Puppy","Beef Pro Adult","Beef Pro Puppy","Vitality Adult","Vitality Puppy","Holistic Adult","Holistic Puppy","Aozi Gold Adult","Aozi Silver Puppy","Special Cat","Special Cat Urinary","Aozi Cat","Aozi Kitten Yellow","Aozi Kitten Violet","Princess","Cuties Cat","Powercat Adult","Powercat Kitten"];
  DATA.forEach(function(d,i){d.id=i; d.sell=null; d.qty=0; d.dem=T1.indexOf(d.n)>=0?1:(T2.indexOf(d.n)>=0?2:3);});

  var filter="all", sortBy="profit", ANALYSIS_TEXT="";
  var $=function(s){return document.querySelector(s)};
  var num=function(v,f){v=parseFloat(v); return isNaN(v)?f:v;};
  var peso=function(v){return "₱"+Math.round(v).toLocaleString("en-PH");};

  function globals(){
    return {dog:num($("#dogSell").value,0), cat:num($("#catSell").value,0), pack:num($("#pack").value,0)};
  }
  function calc(d,g){
    var sell = d.sell!=null ? d.sell : (d.c==="dog"?g.dog:g.cat);
    var cpk = d.p/d.kg;
    var rev = d.kg*sell;
    var profit = rev - d.p - g.pack;
    var margin = rev>0 ? profit/rev*100 : 0;
    return {sell:sell, cpk:cpk, rev:rev, profit:profit, margin:margin};
  }
  function mClass(m){return m>=35?"m-great":m>=20?"m-ok":"m-thin";}
  function demLabel(t){return t===1?"High demand":t===2?"Steady demand":"Price-driven";}

  function rows(){
    var g=globals();
    var arr=DATA.filter(function(d){return filter==="all"||d.c===filter;});
    arr.forEach(function(d){d._=calc(d,g);});
    arr.sort(function(a,b){
      if(sortBy==="name")return a.n.localeCompare(b.n);
      if(sortBy==="demand")return a.dem-b.dem || b._.profit-a._.profit;
      if(sortBy==="cpk")return a._.cpk-b._.cpk;
      if(sortBy==="margin")return b._.margin-a._.margin;
      return b._.profit-a._.profit;
    });
    return arr;
  }

  function render(){
    var arr=rows();
    var list=$("#list"); list.innerHTML="";
    arr.forEach(function(d,idx){
      var r=d._;
      var best=(idx===0 && (sortBy==="profit"||sortBy==="margin"));
      var card=document.createElement("div");
      card.className="card"+(best?" best":"");
      card.innerHTML=
        '<div class="chead">'+
          '<div><div class="cname">'+d.n+(d.guess?' <span class="flag" title="Size not on the list — assumed. Edit if wrong.">*</span>':'')+'</div>'+
            '<span class="tag '+d.c+'">'+(d.c==="dog"?"Dog":"Cat")+'</span>'+
            '<span class="dtag d'+d.dem+'">'+demLabel(d.dem)+'</span></div>'+
          '<div class="profit"><div class="big" data-profit>'+peso(r.profit)+'</div>'+
            '<span class="mbadge '+mClass(r.margin)+'" data-margin>'+Math.round(r.margin)+'% margin</span></div>'+
        '</div>'+
        '<div class="grid">'+
          '<div class="cell"><label>Supplier ₱</label><input class="ed" type="number" inputmode="decimal" data-k="p" value="'+d.p+'"></div>'+
          '<div class="cell"><label>Size (kg)</label><input class="ed" type="number" inputmode="decimal" data-k="kg" value="'+d.kg+'"></div>'+
          '<div class="cell"><label>Sell ₱/kg</label><input class="ed" type="number" inputmode="decimal" data-k="sell" placeholder="'+Math.round(d.c==="dog"?globals().dog:globals().cat)+'" value="'+(d.sell!=null?d.sell:"")+'"></div>'+
        '</div>'+
        '<div class="grid" style="border-top:none;padding-top:0;margin-top:6px">'+
          '<div class="cell"><label>Cost / kg</label><div class="ro" data-cpk>'+peso(r.cpk)+'</div></div>'+
          '<div class="cell"><label>Revenue / sack</label><div class="ro" data-rev>'+peso(r.rev)+'</div></div>'+
          '<div class="cell"><label>Sold at ₱/kg</label><div class="ro" data-usedsell>'+peso(r.sell)+'</div></div>'+
        '</div>'+
        '<div class="orderrow">'+
          '<div class="stepper"><button type="button" data-step="-1">\u2212</button><span data-qty>'+d.qty+'</span><button type="button" data-step="1">+</button></div>'+
          '<div class="linecost" data-line>'+(d.qty>0?("In order: "+peso(d.p*d.qty)):"")+'</div>'+
        '</div>';

      card.querySelectorAll(".ed").forEach(function(inp){
        inp.addEventListener("input",function(){
          var k=inp.getAttribute("data-k"), v=inp.value;
          if(k==="sell"){ d.sell = v===""?null:num(v,null); }
          else { d[k]=num(v, d[k]); }
          liveUpdate(card,d);
        });
        inp.addEventListener("change",render);
      });
      card.querySelectorAll(".stepper button").forEach(function(btn){
        btn.addEventListener("click",function(){
          var step=parseInt(btn.getAttribute("data-step"),10);
          d.qty=Math.max(0,d.qty+step);
          card.querySelector("[data-qty]").textContent=d.qty;
          card.querySelector("[data-line]").textContent=d.qty>0?("In order: "+peso(d.p*d.qty)):"";
          updateOrder();
        });
      });
      list.appendChild(card);
    });

    $("#count").textContent=arr.length+" products"+(filter!=="all"?" ("+filter+")":"");

    // Top pick banner
    var tp=$("#topPick");
    if(arr.length && (sortBy==="profit"||sortBy==="margin")){
      var t=arr[0], tr=t._;
      tp.style.display="block";
      tp.innerHTML="Best pick now: <b>"+t.n+"</b> — "+peso(tr.profit)+" profit per "+t.kg+"kg sack ("+Math.round(tr.margin)+"% margin) at ₱"+Math.round(tr.sell)+"/kg.";
    } else { tp.style.display="none"; }
    updateOrder();
  }

  function liveUpdate(card,d){
    var r=calc(d,globals());
    card.querySelector("[data-profit]").textContent=peso(r.profit);
    var mb=card.querySelector("[data-margin]");
    mb.textContent=Math.round(r.margin)+"% margin";
    mb.className="mbadge "+mClass(r.margin);
    card.querySelector("[data-cpk]").textContent=peso(r.cpk);
    card.querySelector("[data-rev]").textContent=peso(r.rev);
    card.querySelector("[data-usedsell]").textContent=peso(r.sell);
    var ln=card.querySelector("[data-line]");
    if(ln) ln.textContent=d.qty>0?("In order: "+peso(d.p*d.qty)):"";
    updateOrder();
  }

  function updateOrder(){
    var g=globals(), cost=0, sacks=0, profit=0;
    DATA.forEach(function(d){
      if(d.qty>0){ var r=calc(d,g); cost+=d.p*d.qty; sacks+=d.qty; profit+=r.profit*d.qty; }
    });
    var rem=num($("#budget").value,0)-cost;
    $("#obCost").textContent=peso(cost);
    $("#obProfit").textContent=peso(profit);
    $("#obSacks").textContent=sacks+(sacks===1?" sack":" sacks");
    var remEl=$("#obRem");
    remEl.textContent=peso(rem);
    remEl.className=rem<0?"over":"";
    renderAnalysis();
  }

  ["#dogSell","#catSell","#pack"].forEach(function(s){
    $(s).addEventListener("input",render);
  });
  document.querySelectorAll(".chip").forEach(function(ch){
    ch.addEventListener("click",function(){
      document.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on");});
      ch.classList.add("on"); filter=ch.getAttribute("data-f"); render();
    });
  });
  $("#sort").addEventListener("change",function(){sortBy=this.value; render();});
  $("#budget").addEventListener("input",updateOrder);

  $("#foot").innerHTML="Margin is figured on selling price, after supplier cost and packaging. "+
    "Demand tags reflect national Filipino household demand — high demand means people ask for it by name, price-driven means it moves only when it's the cheapest per kilo; your neighborhood may differ, so let your own sell-through confirm it. "+
    "Blank “sell ₱/kg” uses your category rate above; type a number to price that sack differently. "+
    "* size wasn’t on the supplier list — assumed, so check it. Supplier prices change, so update the ₱ cells when they do.";

  function buildState(){
    var items={};
    DATA.forEach(function(d){items[d.n]={p:d.p,kg:d.kg,sell:d.sell,qty:d.qty};});
    return {v:1,g:{dog:num($("#dogSell").value,0),cat:num($("#catSell").value,0),
      pack:num($("#pack").value,0),budget:num($("#budget").value,0)},items:items};
  }
  function applyState(s){
    if(!s||!s.items)throw new Error("bad");
    if(s.g){
      if(s.g.dog!=null)$("#dogSell").value=s.g.dog;
      if(s.g.cat!=null)$("#catSell").value=s.g.cat;
      if(s.g.pack!=null)$("#pack").value=s.g.pack;
      if(s.g.budget!=null)$("#budget").value=s.g.budget;
    }
    DATA.forEach(function(d){
      var it=s.items[d.n];
      if(it){
        if(it.p!=null)d.p=it.p;
        if(it.kg!=null)d.kg=it.kg;
        d.sell=(it.sell==null?null:it.sell);
        d.qty=it.qty!=null?it.qty:0;
      }
    });
    render();
  }
  function slMsg(t,err){var m=$("#slMsg");m.textContent=t;m.className="sl-msg"+(err?" err":"");}

  $("#saveBtn").addEventListener("click",function(){
    var code=JSON.stringify(buildState());
    $("#slText").value=code;
    var done=function(copied){slMsg(copied?"Saved. Code copied — paste it into your Notes to keep it, or tap Download file.":"Saved to the box below. Select and copy it, or tap Download file to keep it.",false);};
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(function(){done(true);},function(){$("#slText").select();done(false);});
      } else { $("#slText").select(); done(false); }
    }catch(e){ $("#slText").select(); done(false); }
  });
  $("#loadBtn").addEventListener("click",function(){
    var v=$("#slText").value.trim();
    if(!v){slMsg("Paste a saved code into the box first, then tap Load.",true);return;}
    try{ applyState(JSON.parse(v)); slMsg("Loaded. Your prices and order are restored.",false); }
    catch(e){ slMsg("Couldn't read that code — make sure you pasted the whole thing.",true); }
  });
  $("#dlBtn").addEventListener("click",function(){
    var code=JSON.stringify(buildState(),null,2);
    try{
      var blob=new Blob([code],{type:"application/json"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      var dt=new Date(), pad=function(x){return(x<10?"0":"")+x;};
      a.href=url; a.download="buy-sheet-"+dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
      $("#slText").value=code; slMsg("File downloaded. Reload it later with Open file.",false);
    }catch(e){ $("#slText").value=code; slMsg("Download not available here — copy the code from the box instead.",true); }
  });
  $("#fileIn").addEventListener("change",function(){
    var f=this.files&&this.files[0]; if(!f){return;}
    var r=new FileReader();
    r.onload=function(){
      $("#slText").value=r.result;
      try{ applyState(JSON.parse(r.result)); slMsg("Loaded from file. Everything restored.",false); }
      catch(e){ slMsg("That file didn't contain a valid buy-sheet code.",true); }
    };
    r.onerror=function(){slMsg("Couldn't read that file.",true);};
    r.readAsText(f);
    this.value="";
  });

  function renderAnalysis(){
    var g=globals();
    var ticked=DATA.filter(function(d){return d.qty>0;});
    var box=$("#analysis");
    if(!ticked.length){
      box.innerHTML='<div class="an-empty">Add sacks to your order (tap + on any product) to see cost and profit here, then Share it.</div>';
      $("#shareRow").style.display="none";
      $("#anText").style.display="none";
      ANALYSIS_TEXT="";
      return;
    }
    $("#shareRow").style.display="flex";
    var totCost=0,totRev=0,totProfit=0,totSacks=0;
    var L=["PET FOOD ORDER ANALYSIS","("+new Date().toLocaleDateString()+")",""];
    var html="";
    ["dog","cat"].forEach(function(cat){
      var grp=ticked.filter(function(d){return d.c===cat;});
      if(!grp.length)return;
      html+='<div class="an-cat">'+(cat==="dog"?"Dog":"Cat")+'</div>';
      L.push((cat==="dog"?"DOG":"CAT")+":");
      grp.forEach(function(d){
        var r=calc(d,g), lc=d.p*d.qty, lp=r.profit*d.qty;
        totCost+=lc; totRev+=r.rev*d.qty; totProfit+=lp; totSacks+=d.qty;
        html+='<div class="an-item"><div class="an-name">'+d.n+' \u00d7'+d.qty+' <span>('+d.kg+'kg)</span></div>'+
          '<div class="an-nums">Cost '+peso(d.p)+'/sack \u00b7 Sell \u20b1'+Math.round(r.sell)+'/kg \u00b7 Profit '+peso(r.profit)+'/sack ('+Math.round(r.margin)+'%)</div>'+
          '<div class="an-line">This line: cost '+peso(lc)+' \u2192 profit '+peso(lp)+'</div></div>';
        L.push("\u2022 "+d.n+" \u00d7"+d.qty+" ("+d.kg+"kg)");
        L.push("   Cost "+peso(d.p)+"/sack | Sell \u20b1"+Math.round(r.sell)+"/kg | Profit "+peso(r.profit)+"/sack ("+Math.round(r.margin)+"%)");
        L.push("   Line: cost "+peso(lc)+" -> profit "+peso(lp));
      });
      L.push("");
    });
    var budget=num($("#budget").value,0), rem=budget-totCost;
    var blended=totRev>0?Math.round(totProfit/totRev*100):0;
    html+='<div class="an-tot">'+
      '<div><span>Sacks</span><b>'+totSacks+'</b></div>'+
      '<div><span>Order cost</span><b>'+peso(totCost)+'</b></div>'+
      '<div><span>Revenue if all sold</span><b>'+peso(totRev)+'</b></div>'+
      '<div><span>Est. profit / cycle</span><b>'+peso(totProfit)+'</b></div>'+
      '<div><span>Budget</span><b>'+peso(budget)+'</b></div>'+
      '<div><span>Remaining</span><b class="'+(rem<0?"over":"")+'">'+peso(rem)+'</b></div>'+
      '<div><span>Blended margin</span><b>'+blended+'%</b></div>'+
    '</div>';
    box.innerHTML=html;

    L.push("TOTALS");
    L.push("Sacks: "+totSacks);
    L.push("Order cost: "+peso(totCost));
    L.push("Revenue if all sold: "+peso(totRev));
    L.push("Est. profit / cycle: "+peso(totProfit));
    L.push("Budget: "+peso(budget)+" | Remaining: "+peso(rem));
    L.push("Blended margin: "+blended+"%");
    ANALYSIS_TEXT=L.join("\n");
  }
  function anMsg(t,err){var m=$("#anMsg");m.textContent=t;m.className="sl-msg"+(err?" err":"");}
  function showAnText(){var t=$("#anText");t.style.display="block";t.value=ANALYSIS_TEXT;t.focus();t.select();}
  function copyAnalysis(){
    if(!ANALYSIS_TEXT){anMsg("Add sacks to your order first.",true);return;}
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(ANALYSIS_TEXT).then(
          function(){anMsg("Copied. Paste it into Messenger, SMS or Notes.",false);},
          function(){showAnText();anMsg("Copy the text shown below.",true);});
      } else { showAnText(); anMsg("Copy the text shown below.",false); }
    }catch(e){ showAnText(); anMsg("Copy the text shown below.",false); }
  }
  $("#shareBtn").addEventListener("click",function(){
    if(!ANALYSIS_TEXT){anMsg("Add sacks to your order first.",true);return;}
    if(navigator.share){
      navigator.share({title:"Pet food order analysis",text:ANALYSIS_TEXT})
        .then(function(){anMsg("Shared.",false);},function(){});
    } else { copyAnalysis(); }
  });
  $("#copyAnBtn").addEventListener("click",copyAnalysis);

  render();
</script>
</body>
</html>
